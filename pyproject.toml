# Tool configuration only (lint + tests for scripts/). The FreeCAD project in
# 3d/ keeps its own pyproject.toml.

[tool.ruff]
target-version = "py310"
extend-exclude = ["Strat_Pickguard", "reference"]

[tool.ruff.lint]
# Classic ruff defaults: pyflakes + the pycodestyle errors that don't overlap
# with a formatter.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# FreeCAD macros: objects are created for their side effects on the active
# document, so the bindings are kept for readability.
"3d/*.py" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]

[tool.coverage.run]
source = ["scripts/svg_path_clustering"]
